<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="pro9.png">
    <title>PRO9 | SECURE ACCESS</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --dark-bg: #020b16;
            --glitch-speed: 0.2s;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--dark-bg);
            font-family: 'Segoe UI', 'Courier New', monospace;
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease-out;
        }

        .loader-text {
            color: var(--neon-blue);
            font-family: monospace;
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin-top: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .scan-bar {
            width: 250px;
            height: 2px;
            background: rgba(0, 242, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .scan-bar::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            animation: scan 1.5s infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Main Content Entrance */
        .frame-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 94%; height: 88%;
            border: 1px solid var(--neon-blue);
            background: rgba(10, 25, 47, 0.9);
            opacity: 0;
            visibility: hidden;
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
        }

        /* The "Clean Entrance" Trigger */
        body.loaded .frame-container {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        body.loaded #loader {
            opacity: 0;
            pointer-events: none;
        }

        iframe {
            width: 100%; height: 100%; border: none;
        }

        /* Decorative Corners */
        .corner {
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--neon-blue);
        }
        .top-l { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .top-r { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bot-l { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .bot-r { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    </style>
</head>
<body>

    <div id="loader">
        <div class="scan-bar"></div>
        <div class="loader-text" id="status-text">Initializing Secure Link...</div>
    </div>

    <div class="frame-container">
        <div class="corner top-l"></div>
        <div class="corner top-r"></div>
        <div class="corner bot-l"></div>
        <div class="corner bot-r"></div>
        
        <iframe 
            src="https://script.google.com/macros/s/AKfycbwbi7dy73O6W-4e6NKnWyTuz-2mENEr7jje7PuE8N_vP-k8Zm8LSl7FqROLr149sgh2FA/exec" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        window.addEventListener('load', () => {
            const status = document.getElementById('status-text');
            
            // Sequence of loading messages
            setTimeout(() => { status.innerText = "Bypassing Firewall..."; }, 800);
            setTimeout(() => { status.innerText = "Identity Verified."; }, 1600);
            
            // Final Entrance
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 2200);
        });
    </script>
</body>
</html>
