<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/png" href="pro9.png">
    <link rel="apple-touch-icon" href="pro9.png">
    
    <title>PRO9 Recruitment | Official Portal</title>
    <style>
        :root {
            --pnp-blue: #003399;
            --pnp-gold: #ffd700;
            --dark-base: #020b16;
            --scan-color: rgba(255, 215, 0, 0.5);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--dark-base);
            font-family: 'Segoe UI', sans-serif;
        }

        /* --- ADVANCED LIGHTING ENTRANCE --- */
        #boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #051020 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: transform 0.9s cubic-bezier(0.7, 0, 0.3, 1);
        }

        /* Moving Light Scan Beam */
        .lighting-sweep {
            position: absolute;
            top: -20%;
            left: 0;
            width: 100%;
            height: 15vh;
            background: linear-gradient(to bottom, transparent, var(--scan-color), transparent);
            filter: blur(5px);
            opacity: 0.6;
            animation: sweep 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes sweep {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1200%); }
        }

        .logo-container {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
            animation: flicker 4s infinite;
        }

        /* Glow Light Aura */
        .logo-glow {
            position: absolute;
            width: 130%;
            height: 130%;
            background: radial-gradient(circle, var(--pnp-gold) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            opacity: 0.15;
            animation: pulse-glow 2s infinite alternate;
        }

        .terminal-text {
            color: var(--pnp-gold);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--pnp-gold);
        }

        /* --- MAIN UI --- */
        .main-wrapper {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.ready #boot-screen { transform: translateY(-100%); }
        body.ready .main-wrapper { opacity: 1; transform: translateY(0); }

        header {
            background: linear-gradient(180deg, var(--pnp-blue) 0%, #001a4d 100%);
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid var(--pnp-gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .header-title { color: #fff; margin: 0; font-size: 1.3rem; font-weight: 700; }
        .header-subtitle { color: var(--pnp-gold); font-size: 0.8rem; letter-spacing: 1px; }

        .iframe-container {
            flex-grow: 1;
            margin: 10px 10px 5px 10px;
            border-radius: 4px;
            background: #fff;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* --- MINIMALIZED FOOTER --- */
        footer {
            height: 20px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-text {
            color: #444;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ANIMATIONS */
        @keyframes pulse-glow {
            from { opacity: 0.1; transform: scale(0.9); }
            to { opacity: 0.25; transform: scale(1.1); }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="lighting-sweep"></div>
        <div class="logo-container">
            <div class="logo-glow"></div>
            <img src="pro9.png" alt="PRO9 Logo">
        </div>
        <div class="terminal-text" id="status-msg">System Scanning...</div>
    </div>

    <div class="main-wrapper">
        <header>
            <h1 class="header-title">POLICE REGIONAL OFFICE 9</h1>
            <div class="header-subtitle">SECURE RECRUITMENT PORTAL</div>
        </header>

        <div class="iframe-container">
            <iframe 
                src="https://script.google.com/macros/s/AKfycbwbi7dy73O6W-4e6NKnWyTuz-2mENEr7jje7PuE8N_vP-k8Zm8LSl7FqROLr149sgh2FA/exec" 
                allowfullscreen>
            </iframe>
        </div>

        <footer>
            <div class="footer-text">Official PRO9 Recruitment System © 2026</div>
        </footer>
    </div>

    <script>
        window.addEventListener('load', () => {
            const status = document.getElementById('status-msg');
            
            setTimeout(() => { status.innerText = "Biometrics Verified..."; }, 1500);
            setTimeout(() => { status.innerText = "Access Granted."; }, 2800);
            
            setTimeout(() => {
                document.body.classList.add('ready');
            }, 3500);
        });
    </script>
</body>
</html>
