<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="icon" type="image/png" href="pro9.png">
    <link rel="apple-touch-icon" href="pro9.png">
    
    <title>PRO9 | SECURE RECRUITMENT SYSTEM</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --dark-bg: #020b16;
            --cyber-border: rgba(0, 242, 255, 0.3);
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace;
        }

        /* Animated Grid Background */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--cyber-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--cyber-border) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        /* Scanline Overlay Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(90deg, 
                rgba(255, 0, 0, 0.06), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Container for the iFrame */
        .frame-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            height: 85%;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            background: rgba(10, 25, 47, 0.8);
            border-radius: 5px;
            overflow: hidden;
            animation: flicker 2s infinite;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            filter: brightness(1.1) contrast(1.1);
        }

        /* Header Text Decor */
        .status-bar {
            position: absolute;
            top: 10px;
            left: 4%;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 1; }
            15% { opacity: 0.9; }
            20% { opacity: 1; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="background-grid"></div>
    <div class="scanlines"></div>

    <div class="status-bar">
        [ SYSTEM: ONLINE ] | ACCESSING PRO9 DATABASE...
    </div>

    <div class="frame-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbwbi7dy73O6W-4e6NKnWyTuz-2mENEr7jje7PuE8N_vP-k8Zm8LSl7FqROLr149sgh2FA/exec" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
